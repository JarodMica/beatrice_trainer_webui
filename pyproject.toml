[project]
name = "beatrice-trainer-webui"
version = "2.0.0rc0"
description = "Windows WebUI and offline package for Beatrice model training"
requires-python = ">=3.11,<3.12"
dependencies = [
    "beatrice-trainer",
    "fastapi==0.112.1",
    "gradio-utils",
    "gradio==4.42.0",
    "pydub==0.25.1",
    "pysrt==1.1.2",
    "starlette==0.38.2",
    "whisperx>=3.3,<4",
]

[project.optional-dependencies]
cpu = ["torch==2.8.0", "torchaudio==2.8.0"]
cu128 = ["torch==2.8.0", "torchaudio==2.8.0"]

[tool.uv]
package = false
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu128" },
    ],
]

[tool.uv.sources]
beatrice-trainer = { path = "modules/beatrice_trainer" }
gradio-utils = { path = "modules/gradio_utils" }
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
